<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Admin - Rich Hustle</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}body{background:#f5f7fb;padding:16px;padding-bottom:80px}.header{background:#0b2a5b;color:#fff;padding:14px;border-radius:12px;margin-bottom:16px}.card{background:#fff;padding:16px;border-radius:12px;box-shadow:0 4px 12px rgba(0,0,0,.06);margin-bottom:14px}input,textarea,select{width:100%;padding:12px;border:1.5px solid #ddd;border-radius:10px;margin:6px 0 12px;font-size:14px}label{font-size:12px;font-weight:bold}.btn{background:#25D366;color:#fff;border:none;padding:14px;border-radius:10px;font-weight:bold;width:100%;font-size:15px}.prod{background:#fff;border-radius:12px;padding:10px;display:flex;gap:10px;align-items:center;margin-bottom:8px;box-shadow:0 2px 8px rgba(0,0,0,.05)}.prod img{width:60px;height:60px;object-fit:cover;border-radius:8px}</style></head><body><div class="header"><h2>Rich Hustle Admin</h2><p style="font-size:12px;opacity:.8">Add Products - No Coding</p></div><div class="card"><h3>Add New Product</h3><label>Name</label><input id="name" placeholder="DELL LATITUDE 5320"><label>Price GHS</label><input id="price" type="number" placeholder="4850"><label>Specs</label><textarea id="specs" rows="3" placeholder="16GB RAM | 256GB SSD"></textarea><label>Image URL (from imgbb.com)</label><input id="image" placeholder="https://...jpg"><button class="btn" onclick="addProduct()">+ Add to Shop</button><button class="btn" style="background:#0b2a5b;margin-top:10px" onclick="location.href='index.html'">View Shop</button></div><div class="card"><h3>Products (<span id="count">0</span>)</h3><div id="list"></div></div><script>let products=JSON.parse(localStorage.getItem('rich_hustle_products')||'[]');function addProduct(){let p={id:Date.now(),name:document.getElementById('name').value,price:document.getElementById('price').value,specs:document.getElementById('specs').value,image:document.getElementById('image').value||'https://images.unsplash.com/photo-1588872657576-7efd1f1555ed?w=400'};if(!p.name||!p.price){alert('Add name & price');return}products.unshift(p);localStorage.setItem('rich_hustle_products',JSON.stringify(products));document.getElementById('name').value='';document.getElementById('price').value='';document.getElementById('specs').value='';document.getElementById('image').value='';render();alert('Added!')}function render(){document.getElementById('count').innerText=products.length;document.getElementById('list').innerHTML=products.map(pr=>`<div class="prod"><img src="${pr.image}"><div style="flex:1"><b style="font-size:13px">${pr.name}</b><br><span style="color:#00b050;font-weight:bold">GHS ${pr.price}</span><br><span style="font-size:11px">${pr.specs}</span></div><button onclick="del(${pr.id})" style="background:#ff4444;color:#fff;border:none;padding:8px 10px;border-radius:8px">X</button></div>`).join('')}function del(id){products=products.filter(x=>x.id!=id);localStorage.setItem('rich_hustle_products',JSON.stringify(products));render()}render();</script></body></html>
