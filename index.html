 rgba(0,0,0,.06);margin-bottom:14px}input,textarea,select{width:100%;padding:12px;border:1.5px solid #ddd;border-radius:10px;margin:6px 0 12px;font-size:14px}label{font-size:11px;font-weight:bold}.btn{background:#25D366;color:#fff;border:none;padding:14px;border-radius:10px;font-weight:bold;width:100%;font-size:15px}.prodAdmin{background:#fff;border-radius:12px;padding:10px;display:flex;gap:10px;align-items:center;margin-bottom:8px;box-shadow:0 2px 8px rgba(0,0,0,.05)}.prodAdmin img{width:60px;height:60px;object-fit:cover;border-radius:8px}</style></head><body><div class="header"><div class="logo">💻 Rich Hustle<br><small style="font-size:11px;color:#666;font-weight:400">Laptop & Accessories • Accra</small></div><button onclick="toggleAdmin()" style="font-size:11px;background:#0b2a5b;color:#fff;padding:8px 14px;border-radius:20px;border:none">⚙️ Admin</button></div><div class="hero"><div style="flex:1.2"><h2>Your Trusted Tech Partner in Accra</h2><p style="font-size:12px;opacity:.9;margin:8px 0">✅ Genuine • 🚚 Fast Delivery • 🛡️ Warranty</p><a class="btn-wa" href="https://wa.me/233542861284">💬 WhatsApp: 0542861284</a></div><div style="flex:.8;text-align:center;font-size:50px">💻<br>📱</div></div><div id="products" class="products"></div><a class="footer-wa" href="https://wa.me/233542861284">💬 Chat & Order: 0542861284</a><div id="adminPanel"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><h2>Rich Hustle Admin</h2><button onclick="toggleAdmin()" style="background:#ff4444;color:#fff;border:none;padding:8px 14px;border-radius:8px">Close X</button></div><div class="inputCard"><h3>Add Product</h3><label>Name</label><input id="name" placeholder="DELL LATITUDE 5320"><label>Price GHS</label><input id="price" type="number" placeholder="4850"><label>Tag (e.g BOX PACK)</label><input id="tag" placeholder="BOX PACK • FEATURED"><label>Specs (use new line)</label><textarea id="specs" rows="3" placeholder="11th Gen i5\n16GB RAM | 256GB SSD"></textarea><label>Image URL (upload to imgbb.com)</label><input id="image" placeholder="https://...jpg"><button class="btn" onclick="addProduct()">+ Add to Shop</button></div><div class="inputCard"><h3>Your Products (<span id="count">0</span>)</h3><div id="adminList"></div></div></div><script>const defaults=[{name:"DELL LATITUDE 5320",price:"4850",tag:"BOX PACK • FEATURED",image:"https://images.unsplash.com/photo-1593642632823-8f785ba67e45?w=500",specs:"11th Gen i5-1135G7\n16GB RAM | 256GB SSD\n14\" Touchscreen"},{name:"DELL LATITUDE 3190 x360",price:"2300",tag:"X360 CONVERTIBLE",image:"https://images.unsplash.com/photo-1588872657576-7efd1f1555ed?w=500",specs:"Pentium N5030\n8GB RAM | 128GB SSD\nTouch x360"},{name:"HP ELITEBOOK 840 G4",price:"2950",tag:"BEST SELLER",image:"https://images.unsplash.com/photo-1583223667854-e0e05b1ad2ad?w=500",specs:"Core i5\n8GB RAM | 256GB SSD\n14\" Display"},{name:"LENOVO CHARGER 90W",price:"250",tag:"ACCESSORY",image:"https://images.unsplash.com/photo-1625842268584-8f3296238f6a?w=500",specs:"Original 90W\nFast Charge"},{name:"iPhone 11 64GB",price:"2100",tag:"IPHONE",image:"https://images.unsplash.com/photo-1574944985070-8f3ebc6b79d2?w=500",specs:"64GB • Battery 88%\nFace ID • Warranty"}];let products=JSON.parse(localStorage.getItem('rich_hustle_products')||'[]');function toggleAdmin(){let p=document.getElementById('adminPanel');p.style.display=p.style.display==='block'?'none':'block';renderAdmin()}function addProduct(){let pr={id:Date.now(),name:document.getElementById('name').value,price:document.getElementById('price').value,tag:document.getElementById('tag').value||'NEW',specs:document.getElementById('specs').value,image:document.getElementById('image').value||'https://images.unsplash.com/photo-1593642632823-8f785ba67e45?w=500'};if(!pr.name||!pr.price){alert('Add name & price');return}products.unshift(pr);localStorage.setItem('rich_hustle_products',JSON.stringify(products));document.getElementById('name').value='';document.getElementById('price').value='';document.getElementById('tag').value='';document.getElementById('specs').value='';document.getElementById('image').value='';render();renderAdmin();alert('Added!')}function del(id){products=products.filter(x=>x.id!=id);localStorage.setItem('rich_hustle_products',JSON.stringify(products));render();renderAdmin()}function render(){let all=[...products,...defaults];document.getElementById('products').innerHTML=all.map(p=>`<div class="card"><img src="${p.image}"><div class="card-body"><span class="tag">${p.tag||'NEW'}</span><br><b style="font-size:13px">${p.name}</b><div class="price">GHS ${p.price}</div><div class="specs">${p.specs}</div><a class="order" href="https://wa.me/233542861284?text=Hello%20Rich%20Hustle%20-%20I%20want%20${encodeURIComponent(p.name)}%20GHS%20${p.price}">💬 Order</a></div></div>`).join('')}function renderAdmin(){document.getElementById('count').innerText=products.length;document.getElementById('adminList').innerHTML=products.map(pr=>`<div class="prodAdmin"><img src="${pr.image}"><div style="flex:1"><b style="font-size:13px">${pr.name}</b><br><span style="color:#00b050;font-weight:bold">GHS ${pr.price}</span></div><button onclick="del(${pr.id})" style="background:#ff4444;color:#fff;border:none;padding:8px 10px;border-radius:8px">X</button></div>`).join('')||'<p style="font-size:12px;color:#888">No custom products yet. Add above.</p>'}render();</script></body></html>
