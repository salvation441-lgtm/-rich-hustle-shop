<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Rich Hustle - Accra</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,Arial}body{background:#f0f2f8;padding-bottom:80px}.header{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;background:#fff;position:sticky;top:0;z-index:20;box-shadow:0 4px 20px rgba(0,0,0,.06)}.logo{font-weight:900;color:#0b2a5b;cursor:pointer}.hero{margin:12px;border-radius:22px;background:linear-gradient(135deg,#0b2a5b 0%,#0d8f85 100%);color:#fff;padding:22px;display:flex;align-items:center}.btn-wa{background:#25D366;color:#fff;padding:12px 18px;border-radius:14px;text-decoration:none;font-weight:800;display:inline-flex;margin-top:8px;font-size:13px}.products{padding:12px;display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.06)}.card img{width:100%;height:158px;object-fit:cover}.card-body{padding:12px}.price{color:#00b050;font-weight:900}.specs{font-size:11px;color:#666;white-space:pre-line}.order{margin-top:10px;background:linear-gradient(135deg,#25D366,#128C7E);color:#fff;display:block;text-align:center;padding:11px;border-radius:12px;text-decoration:none;font-weight:900;font-size:12px}.tag{font-size:9px;background:#e6f7ee;color:#0a7a42;padding:5px 10px;border-radius:20px;font-weight:800;display:inline-block;margin-bottom:5px}.footer-wa{position:fixed;bottom:0;left:0;right:0;background:linear-gradient(90deg,#25D366,#128C7E);color:#fff;text-align:center;padding:16px;font-weight:900;text-decoration:none;z-index:30}
#adminPanel{display:none;position:fixed;inset:0;background:linear-gradient(180deg,#f8faff,#eef2f8);z-index:100;overflow-y:auto;padding-bottom:100px}.admin-top{position:sticky;top:0;background:linear-gradient(135deg,#0b2a5b,#102a6d);color:#fff;padding:18px 20px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 10px 30px rgba(11,42,91,.3);border-radius:0 0 22px 22px}.glass{background:#fff;margin:16px;border-radius:20px;padding:18px;box-shadow:0 12px 32px rgba(0,0,0,.08);border:1px solid #eef2f8}.glass h3{font-size:15px;margin-bottom:12px}label{font-size:11px;font-weight:800;color:#0b2a5b;text-transform:uppercase;margin-top:8px;display:block}input,textarea{width:100%;padding:13px 14px;border:1.8px solid #e3e8f2;border-radius:14px;margin:6px 0 14px;font-size:14px;background:#f8faff;outline:none}input:focus,textarea:focus{border-color:#0b2a5b;background:#fff;box-shadow:0 0 0 4px rgba(11,42,91,.08)}.input-error{border-color:#ff4458 !important;background:#fff0f0 !important}.file-box{border:2px dashed #a3b3d6;border-radius:16px;padding:16px;text-align:center;background:linear-gradient(135deg,#f8faff,#eef4ff);cursor:pointer;display:block}.file-box span{font-size:12px;color:#0b2a5b;font-weight:800}#preview{width:100%;height:200px;object-fit:cover;border-radius:16px;display:none;margin-top:12px;box-shadow:0 8px 24px rgba(0,0,0,.12);border:3px solid #fff}.btn-main{background:linear-gradient(135deg,#25D366,#128C7E);color:#fff;border:none;padding:16px;border-radius:14px;font-weight:900;width:100%;font-size:15px;box-shadow:0 10px 24px rgba(37,211,102,.35);margin-top:6px}.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#0b2a5b;color:#fff;padding:12px 20px;border-radius:30px;font-size:13px;font-weight:700;z-index:200;display:none;box-shadow:0 10px 30px rgba(0,0,0,.2)}.prodAdmin{background:#fff;border-radius:16px;padding:12px;display:flex;gap:12px;align-items:center;margin-bottom:10px;box-shadow:0 4px 16px rgba(0,0,0,.05)}.prodAdmin img{width:64px;height:64px;object-fit:cover;border-radius:12px}</style></head><body><div id="toast" class="toast"></div><div class="header"><div class="logo" onclick="secretTap()">💻 Rich Hustle<br><small style="font-size:11px;color:#666;font-weight:500">Accra • Ghana</small></div><div style="font-size:10px;color:#8aa0c5;font-weight:700">Tap logo 5x = Admin</div></div><div class="hero"><div style="flex:1.2"><h2 style="font-size:20px;line-height:1.2">Your Trusted<br>Tech Partner</h2><p style="font-size:12px;opacity:.9;margin:8px 0 10px">✅ Genuine • 🚚 Fast • 🛡️ Warranty</p><a class="btn-wa" href="https://wa.me/233542861284">💬 0542861284</a></div><div style="flex:.8;text-align:center;font-size:50px">💻</div></div><div id="products" class="products"></div><a class="footer-wa" href="https://wa.me/233542861284">💬 Chat & Order: 0542861284</a><div id="adminPanel"><div class="admin-top"><div><h2>✨ Rich Hustle Studio</h2><p style="font-size:11px;opacity:.8">Pro Admin Panel</p></div><button onclick="toggleAdmin()" style="background:rgba(255,255,255,.18);color:#fff;border:1px solid rgba(255,255,255,.3);padding:10px 16px;border-radius:12px;font-weight:800">✕ Close</button></div><div class="glass"><h3>🛒 Add New Product</h3><label>Product Name *</label><input id="name" placeholder="e.g. HP ELITEBOOK 840 G8"><label>Price GHS *</label><input id="price" type="number" inputmode="numeric" placeholder="e.g. 4850"><label>Badge Tag</label><input id="tag" placeholder="e.g. 10 UNITS AVAILABLE"><label>Specs</label><textarea id="specs" rows="3" placeholder="Intel i7 11th Gen&#10;16GB RAM | 512GB SSD&#10;Touchscreen • Warranty"></textarea><label>📸 Product Photo</label><label class="file-box" for="fileInput"><div style="font-size:30px">🖼️</div><span id="fileText">TAP TO CHOOSE FROM GALLERY</span><div style="font-size:10px;color:#888;margin-top:4px">JPG, PNG - Auto compress</div><input type="file" id="fileInput" accept="image/*" onchange="previewImage(event)" hidden></label><img id="preview"><label style="margin-top:12px">Or Image URL (optional)</label><input id="image" placeholder="https://...jpg"><button class="btn-main" onclick="addProduct()">✨ Add to Shop Now</button><div id="err" style="color:#ff4458;font-size:11px;font-weight:700;margin-top:10px;display:none"></div></div><div class="glass"><h3>📦 Your Live Products (<span id="count">0</span>)</h3><div id="adminList"></div></div></div><script>let tap=0;function secretTap(){tap++;if(tap>=5){toggleAdmin();tap=0;showToast('🔓 Admin unlocked')}setTimeout(()=>tap=0,2000)}if(location.search.includes('admin'))document.getElementById('adminPanel').style.display='block';function showToast(m){let t=document.getElementById('toast');t.innerText=m;t.style.display='block';setTimeout(()=>t.style.display='none',3000)}const defaults=[{name:"DELL LATITUDE 5320",price:"4850",tag:"BOX PACK • FEATURED",image:"https://images.unsplash.com/photo-1593642632823-8f785ba67e45?w=500",specs:"11th Gen i5\n16GB RAM | 256GB SSD"},{name:"HP ELITEBOOK STACK - 10 UNITS",price:"3200",tag:"10 UNITS AVAILABLE",image:"https://images.unsplash.com/photo-1588872657576-7efd1f1555ed?w=500",specs:"HP EliteBook\nBulk Stock\nAccra - Ready"}];let products=JSON.parse(localStorage.getItem('rich_hustle_products')||'[]');let base64Img="";function previewImage(e){let f=e.target.files[0];if(!f)return;document.getElementById('fileText').innerText='✓ Photo Selected: '+f.name;let r=new FileReader();r.onload=ev=>{base64Img=ev.target.result;let p=document.getElementById('preview');p.src=base64Img;p.style.display='block'};r.readAsDataURL(f);showToast('📸 Photo loaded')}function toggleAdmin(){let p=document.getElementById('adminPanel');p.style.display=p.style.display==='block'?'none':'block';renderAdmin()}function addProduct(){let nameEl=document.getElementById('name');let priceEl=document.getElementById('price');let name=nameEl.value.trim();let price=priceEl.value.trim();let err=document.getElementById('err');nameEl.classList.remove('input-error');priceEl.classList.remove('input-error');err.style.display='none';if(!name||!price){if(!name)nameEl.classList.add('input-error');if(!price)priceEl.classList.add('input-error');err.innerText='⚠️ Please enter Product Name and Price (both required)';err.style.display='block';showToast('⚠️ Fill Name & Price');return}let img=document.getElementById('image').value.trim()||base64Img||'https://images.unsplash.com/photo-1593642632823-8f785ba67e45?w=500';let pr={id:Date.now(),name:name,price:price,tag:document.getElementById('tag').value||'NEW',specs:document.getElementById('specs').value||'Genuine Product\nWarranty Included',image:img};products.unshift(pr);localStorage.setItem('rich_hustle_products',JSON.stringify(products));['name','price','tag','specs','image','fileInput'].forEach(id=>{let el=document.getElementById(id);if(el)el.value=''});document.getElementById('preview').style.display='none';document.getElementById('fileText').innerText='TAP TO CHOOSE FROM GALLERY';base64Img='';render();renderAdmin();showToast('✅ Product Added!');setTimeout(()=>{toggleAdmin();window.scrollTo(0,0)},800)}function del(id){if(!confirm('Delete this product?'))return;products=products.filter(x=>x.id!=id);localStorage.setItem('rich_hustle_products',JSON.stringify(products));render();renderAdmin();showToast('🗑️ Deleted')}function render(){let all=[...products,...defaults];document.getElementById('products').innerHTML=all.map(p=>`<div class="card"><img src="${p.image}"><div class="card-body"><span class="tag">${p.tag}</span><br><b style="font-size:13px">${p.name}</b><div class="price">GHS ${p.price}</div><div class="specs">${p.specs}</div><a class="order" href="https://wa.me/233542861284?text=Hello%20Rich%20Hustle%20-%20I%20want%20${encodeURIComponent(p.name)}%20GHS%20${p.price}">💬 Order</a></div></div>`).join('')}function renderAdmin(){document.getElementById('count').innerText=products.length;document.getElementById('adminList').innerHTML=products.map(pr=>`<div class="prodAdmin"><img src="${pr.image}"><div style="flex:1"><b style="font-size:13px">${pr.name}</b><br><span style="color:#00b050;font-weight:bold">GHS ${pr.price}</span></div><button onclick="del(${pr.id})" style="background:#ff4458;color:#fff;border:none;padding:9px 12px;border-radius:10px;font-weight:800">✕</button></div>`).join('')||'<p style="font-size:12px;color:#8896b3;padding:16px;text-align:center">No custom products yet.<br>Your first product will appear here ✨</p>'}render();</script></body></html>
